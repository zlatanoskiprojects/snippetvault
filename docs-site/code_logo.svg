<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="800" height="800">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#7b2ff7"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#feca57"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background (optional, remove if you want transparent) -->
  <rect width="200" height="200" rx="40" fill="#0f172a"/>

  <!-- Left Bracket -->
  <path d="M 70 40 L 40 100 L 70 160" 
        stroke="url(#grad1)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)"/>

  <!-- Right Bracket -->
  <path d="M 130 40 L 160 100 L 130 160" 
        stroke="url(#grad1)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)"/>

  <!-- Slash -->
  <line x1="95" y1="160" x2="105" y2="40" 
        stroke="url(#grad2)" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Decorative dots -->
  <circle cx="55" cy="100" r="4" fill="#00d4ff" opacity="0.6"/>
  <circle cx="145" cy="100" r="4" fill="#7b2ff7" opacity="0.6"/>
</svg>