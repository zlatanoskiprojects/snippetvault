<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
  </defs>

  <rect width="640" height="220" fill="#141414"/>

  <!-- Mark: rounded square with code-bracket motif and SV monogram -->
  <g transform="translate(40,40)">
    <rect width="140" height="140" rx="28" fill="url(#mark-grad)"/>
    <!-- angle brackets -->
    <path d="M42 46 L24 70 L42 94" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.55"/>
    <path d="M98 46 L116 70 L98 94" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.55"/>
    <!-- SV monogram -->
    <text x="70" y="86" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="46" fill="#ffffff" text-anchor="middle">SV</text>
  </g>

  <!-- Wordmark -->
  <text x="205" y="105" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="46" fill="#ffffff">
    <tspan fill="#ffffff">Snippet</tspan><tspan fill="#818cf8">Vault</tspan>
  </text>

  <!-- Tagline -->
  <text x="207" y="140" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="19" letter-spacing="0.3" fill="#9ca3af">
    Save code. Understand it. Reuse it faster.
  </text>
</svg>
