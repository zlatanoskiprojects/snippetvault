name: Publish Docker images

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: snippetvault-frontend
            context: ./frontend
            target: ""
            build_args: VITE_API_URL=/api
          - image: snippetvault-backend
            context: ./backend
            target: ""
            build_args: ""
          - image: snippetvault-migrate
            context: ./backend
            target: migrate
            build_args: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image metadata
        id: image
        shell: bash
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and publish ${{ matrix.image }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          build-args: ${{ matrix.build_args }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ steps.image.outputs.owner }}/${{ matrix.image }}:${{ steps.image.outputs.version }}

  promote-latest:
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image metadata
        id: image
        shell: bash
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Promote versioned images to latest
        shell: bash
        env:
          OWNER: ${{ steps.image.outputs.owner }}
          VERSION: ${{ steps.image.outputs.version }}
        run: |
          for image in snippetvault-frontend snippetvault-backend snippetvault-migrate; do
            docker buildx imagetools create \
              --tag "ghcr.io/${OWNER}/${image}:latest" \
              "ghcr.io/${OWNER}/${image}:${VERSION}"
          done
