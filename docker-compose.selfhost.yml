services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: snippetvault
      POSTGRES_USER: snippetvault
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snippetvault -d snippetvault"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  migrate:
    image: ghcr.io/zlatanoski/snippetvault-migrate:${SNIPPETVAULT_VERSION}
    environment:
      DATABASE_URL: postgresql://snippetvault:${POSTGRES_PASSWORD}@postgres:5432/snippetvault
    depends_on:
      postgres:
        condition: service_healthy
    command: pnpm migrate

  backend:
    image: ghcr.io/zlatanoski/snippetvault-backend:${SNIPPETVAULT_VERSION}
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://snippetvault:${POSTGRES_PASSWORD}@postgres:5432/snippetvault
      CLIENT_URL: ${CLIENT_URL:?CLIENT_URL must be set}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL must be set}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}
      AI_KEY_SECRET: ${AI_KEY_SECRET:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY must be set}
      EMAIL_FROM: ${EMAIL_FROM:?EMAIL_FROM must be set}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-placeholder}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-placeholder}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-placeholder}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-placeholder}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    image: ghcr.io/zlatanoski/snippetvault-frontend:${SNIPPETVAULT_VERSION}
    restart: unless-stopped
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile.selfhost", "--adapter", "caddyfile"]
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN must be set}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
